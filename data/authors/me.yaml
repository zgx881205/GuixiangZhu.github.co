bio: |
  欢迎来到我的个人主页。

  朱桂祥，1989年生，江苏省扬州市宝应县人，民革党员，工学博士，副教授，硕士生导师，南京财经大学计算机与人工智能学院副院长（挂），校网络与数据中心特聘专家，计算机科学与技术系主任，工商管理学院旅游数智决策与创新管理实验室特聘研究员，江苏省科技副总，栖智OPC社区创业导师，研究方向：商务智能、人工智能、大模型、推荐系统、智慧文旅和社会计算。在国内外著名SCI、SSCI、EI期刊和EI国际会议上发表论文40余篇，如TWEB、TII、IPM、Neural Networks、ECRA、KBS、ESWA、Neurocomputing、WWWJ、KAIS、MTA、TIST、计算机研究与发展、电子与信息学报、WISE2024国际会议等，申请发明专利10余项，获授权发明专利5项，2017年获CSC国家公派留学奖学金，2026年获南京财经大学“青年五四奖章”。主持江苏省社科基金一般项目、江苏省科技厅产学研合作项目、江苏省教育厅高校哲学社会科学研究项目、南京财经大学青年学者研究计划，参与国家自然科学基金委项目以及江苏省科技厅项目10余项，研发的个性化旅游推荐、跨境电商推荐模型和电商智能营销决策系统在途牛旅游网、江苏中创供应链有限公司得到了应用。
